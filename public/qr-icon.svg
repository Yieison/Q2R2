<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- QR Code Pattern -->
  <rect x="10" y="10" width="30" height="30" rx="3" fill="url(#grad)"/>
  <rect x="18" y="18" width="14" height="14" rx="2" fill="white"/>
  
  <rect x="60" y="10" width="30" height="30" rx="3" fill="url(#grad)"/>
  <rect x="68" y="18" width="14" height="14" rx="2" fill="white"/>
  
  <rect x="10" y="60" width="30" height="30" rx="3" fill="url(#grad)"/>
  <rect x="18" y="68" width="14" height="14" rx="2" fill="white"/>
  
  <!-- Center dots pattern -->
  <rect x="50" y="50" width="8" height="8" rx="1" fill="url(#grad)"/>
  <rect x="62" y="50" width="8" height="8" rx="1" fill="url(#grad)"/>
  <rect x="50" y="62" width="8" height="8" rx="1" fill="url(#grad)"/>
  <rect x="62" y="62" width="8" height="8" rx="1" fill="url(#grad)"/>
  
  <rect x="50" y="75" width="8" height="8" rx="1" fill="url(#grad)"/>
  <rect x="62" y="75" width="8" height="8" rx="1" fill="url(#grad)"/>
  <rect x="75" y="50" width="8" height="8" rx="1" fill="url(#grad)"/>
  <rect x="75" y="62" width="8" height="8" rx="1" fill="url(#grad)"/>
</svg>
